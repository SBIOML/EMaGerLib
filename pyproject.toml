[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emagerlib"
version = "1.2.1"
requires-python = ">=3.8"
description = "A comprehensive toolbox for working with the EMaGer v1 and v3 EMG acquisition devices, featuring real-time gesture recognition and prosthetic hand control capabilities."
readme = "README.md"
authors = [
    {name = "Étienne Michaud", email = "etmic6@ulaval.ca"},
]
license = {text = "MIT"}
dependencies = [
    # emagerlib uses fork-only features (e.g. libemg.streamers.emagerv3_streamer).
    # The fork branch emager-v3-update is the supported libemg source.
    # To switch sources, see [project.optional-dependencies] below.
    "libemg @ git+https://github.com/Michiboi29/libemg-fork.git@emager-v3-update",
    "torch",
    "lightning",
    "brevitas",
    "numpy",
    "scipy",
    "scikit-learn",
    "pyserial",
    "pyqt5",
    "pyqt6",
    "pyqtgraph",
    "PyOpenGL", #optimize visualization
    "ability-hand",
    "bleak",     # BLE communication (ble_client)
    "PyYAML",    # YAML config loading/saving
]

[project.optional-dependencies]
# Alternative libemg sources. To switch from the default fork:
#   pip uninstall libemg -y
#   pip install -e ".[pypi]"     # or [latest]
pypi   = ["libemg"]
latest = ["libemg @ git+https://github.com/libemg/libemg.git@latest"]
dev = [
    # Add developer dependencies here when needed (e.g. pytest, ruff)
]

[project.scripts]
# Main entry point
emager = "examples.main:main"
emager-gui = "examples.gui.command_launcher:main"

# Tests
emager-run-tests = "tests.run_all_tests:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["emagerlib*", "examples*", "tests*"]
exclude = ["configs*", "config_examples*", "lightning_logs*"]

