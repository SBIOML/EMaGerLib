[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emagerlib"
version = "1.2.1"
requires-python = ">=3.8"
description = "A comprehensive toolbox for working with the EMaGer v1 and v3 EMG acquisition devices, featuring real-time gesture recognition and prosthetic hand control capabilities."
readme = "README.md"
authors = [
    {name = "Étienne Michaud", email = "etmic6@ulaval.ca"},
]
license = {text = "MIT"}
dependencies = [
    "libemg @ git+https://github.com/Michiboi29/libemg-fork.git@emager-v3",
    "torch",
    "lightning",
    "brevitas",
    "numpy",
    "scipy",
    "scikit-learn",
    "pyserial",
    "pyqt5",
    "pyqt6",
    "pyqtgraph",
    "PyOpenGL", #optimize visualization
    "ability-hand",
    "bleak",     # BLE communication (ble_client)
    "PyYAML",    # YAML config loading/saving
]

# To switch the libemg source from the default fork, run a manual two-step
# swap (extras cannot override a base URL-pinned dependency, so we don't use
# extras for this):
#   pip uninstall libemg -y
#   pip install libemg                                                # pypi release
#   pip install "libemg @ git+https://github.com/libemg/libemg.git@latest"
[project.optional-dependencies]
dev = [
    # Add developer dependencies here when needed (e.g. pytest, ruff)
]
# Microcontroller export toolchain (examples/deployment/export_model.py):
# PyTorch -> ONNX -> TFLite (float32 + full INT8) -> C array. Not needed for the
# core library or realtime paths; install only when exporting models for an MCU.
#   pip install -e ".[deploy]"
deploy = [
    "onnx",
    "onnxruntime",
    "tensorflow",
    "onnx2tf",
    "tf_keras",      # onnx2tf needs it to emit a TF SavedModel for INT8 conversion
    "onnx-graphsurgeon",  # onnx2tf imports this unconditionally but does not
                          # declare it as a dependency -- without it, `import
                          # onnx2tf` fails with ModuleNotFoundError at import time.
    "psutil",             # same story: onnx2tf.utils.common_functions imports it
                          # unconditionally without declaring the dependency.
    "onnxsim",            # onnx2tf silently skips simplification if this is missing
                          # (no error) -- for this model that silent skip is not
                          # cosmetic: it leaves a dynamic Pad node onnx2tf's own
                          # NCHW->NHWC axis remap mishandles, corrupting a later
                          # Conv's channel count. Needs a C++ toolchain to build (no
                          # prebuilt wheel) -- see export-model.ps1 / doc 1 if this
                          # fails with "Could not find cmake executable".
]

[project.scripts]
# Main entry point
emager = "examples.main:main"
emager-gui = "examples.gui.command_launcher:main"

# Tests
emager-run-tests = "tests.run_all_tests:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["emagerlib*", "examples*", "tests*"]
exclude = ["configs*", "config_examples*", "lightning_logs*"]

